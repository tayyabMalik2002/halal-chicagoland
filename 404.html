<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0D0D0D" />
  <title>Page not found — Zabiha Halal Chicagoland</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
    }
    .not-found h1 {
      color: var(--gold);
      font-size: 1.75rem;
      margin-bottom: 8px;
    }
    .not-found p {
      color: var(--text-2);
      margin-bottom: 24px;
    }
    .not-found a {
      color: var(--bg);
      background: var(--gold);
      padding: 10px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="not-found">
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist.</p>
    <a href="/">Back to home</a>
  </div>
</body>
</html>
