services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: restaurants_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
      - ./backend/database:/docker-entrypoint-initdb.d/sql/database
      - ./backend/sql:/docker-entrypoint-initdb.d/sql/menu-analyzer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  flask-api:
    build: ./backend-flask
    environment:
      DATABASE_URL: postgresql://postgres:localdevpassword@postgres:5432/restaurants_db?sslmode=disable
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy

  express-api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:localdevpassword@postgres:5432/menu_ops_db?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "3010:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
